<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG Stats — Error</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="wrap">
    <h1>PUBG Stats</h1>
    <section class="card">
        <h2>Something went wrong</h2>
        <p class="meta" th:text="${message} ?: 'An unexpected error occurred.'">An unexpected error occurred.</p>
        <p><a th:href="@{/}">Back to the dashboard</a></p>
    </section>
</main>
</body>
</html>
