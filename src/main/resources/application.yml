spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pubgstats}
    username: ${SPRING_DATASOURCE_USERNAME:pubgstats}
    password: ${SPRING_DATASOURCE_PASSWORD:pubgstats}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

pubg:
  api-key: ${PUBG_API_KEY:}
  shard: ${PUBG_SHARD:steam}
  base-url: https://api.pubg.com
  cache-ttl-hours: 24
  # First entry is the user handle, the rest are pro players. Override with a comma-separated PUBG_PLAYERS.
  players: ${PUBG_PLAYERS:shroud,chocoTaco,TGLTN,WackyJacky101,Pio}
